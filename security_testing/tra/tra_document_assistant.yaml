# Threat and Risk Assessment — Multi-Agent Document Assistant
# Generated by Threat Modeling Skill
# Date: 2026-11-24
# Target: Document Assistant (Coordinator + Document Reader + Findings Manager)

target:
  name: "Multi-Agent Document Assistant"
  description: "Three-agent cybersecurity assessment workbench with Coordinator, Document Reader, and Findings Manager"
  agents: ["Coordinator", "Document Reader", "Findings Manager"]
  entry_channels:
    C1: "Direct chat via POST /api/agent/chat"
    C2: "Uploaded reports via POST /api/reports/upload"
    C3: "Inter-agent delegation context (via C1 or C2 content)"
  roles: ["analyst", "manager", "evaluator"]
  data_assets:
    - "VAPT assessment reports (uploaded documents)"
    - "Security findings (severity, status)"
    - "Finding change history with authorization attribution"
    - "Scope grants and approval records"
    - "Agent system prompts and configuration"

# Risk assessment methodology:
#   Preliminary Likelihood: Unlikely / Possible / Likely / Almost certain
#     Based on architectural analysis. Marked "Preliminary" when not confirmed by testing.
#   Impact: Low / Medium / High / Critical
#     Based on potential security consequences to the assessment process.
#   Risk Rating: Likelihood × Impact (qualitative, per the matrix below)
#   Risk Level: Derived from Risk Rating using the standard matrix
#
#   Risk level matrix:
#     | Likelihood \ Impact | Low    | Medium | High   | Critical |
#     |---------------------|--------|--------|--------|----------|
#     | Unlikely            | Low    | Low    | Medium | High     |
#     | Possible            | Low    | Medium | High   | High     |
#     | Likely              | Medium | High   | High   | Critical |
#     | Almost certain      | Medium | High   | Critical| Critical|
#
#   All assessments are preliminary until validated by red-team testing.

# ═══════════════════════════════════════════════════════════════════════════════
# PART A: Threat Applicability Matrix
# ═══════════════════════════════════════════════════════════════════════════════

threat_applicability:
  - threat_id: "RP.1"
    threat_name: "Prompt Injection"
    status: "Applicable"
    rationale: >
      Uploaded reports (C2) contain attacker-controlled text that enters
      the Document Reader's LLM context. Direct chat messages (C1) reach
      the Coordinator's LLM context. Inter-agent delegation (C3) relays
      content across trust boundaries. All three channels can carry
      injected instructions.
    attack_surfaces:
      - "C2: uploaded reports processed by Document Reader"
      - "C1: direct chat messages to Coordinator"
      - "C3: Reader output relayed to Coordinator and Findings Manager"
    trust_boundaries:
      - "Document content → Reader LLM context"
      - "Reader output → Coordinator instruction processing"
      - "Coordinator context → Findings Manager delegation"

  - threat_id: "RP.2"
    threat_name: "Agent Goal Hijack"
    status: "Applicable"
    rationale: >
      The Coordinator maintains a task plan derived from the user's request.
      Content from the Document Reader's response could influence the
      Coordinator to change its plan or delegate tasks the user didn't request.
    attack_surfaces:
      - "C2→C3: injected content in Reader output influences Coordinator's plan"
    trust_boundaries:
      - "Reader output → Coordinator task planning"
      - "Coordinator plan → Findings Manager delegation"

  - threat_id: "KM.1"
    threat_name: "Memory and Context Poisoning"
    status: "Applicable"
    rationale: >
      Conversation history persists within a session and is sent to the LLM
      on each turn. Injected content from earlier turns can influence later
      turns. The Coordinator may forward full history to the Reader on
      delegation. FTS5 search retrieves uploaded content without trust ranking.
    attack_surfaces:
      - "Session history carrying injected content across turns"
      - "Full history forwarded to Reader on delegation"
      - "FTS5 search returning keyword-stuffed documents"
    trust_boundaries:
      - "Previous turn output → current turn LLM context"
      - "Coordinator history → Reader delegation context"

  - threat_id: "TA.1"
    threat_name: "Tool Misuse and Exploitation"
    status: "Applicable"
    rationale: >
      The Findings Manager exposes tools that modify database state
      (update_finding). The scope management workflow has multiple
      authorization controls that could be individually weakened.
      Search tools may return content across trust boundaries.
    attack_surfaces:
      - "update_finding tool: severity/status modification"
      - "search_reports: information disclosure"
      - "get_findings: cross-report data exposure"
    trust_boundaries:
      - "Tool arguments → database modification"
      - "Authorization check → scope grant validation"

  - threat_id: "IA.1"
    threat_name: "Identity and Privilege Abuse"
    status: "Applicable"
    rationale: >
      User role flows from HTTP authentication through the Coordinator to
      the Findings Manager via delegation parameters. The Findings Manager
      could trust the delegated role instead of independently verifying
      against the HTTP auth context. Credentials could leak through
      system prompts or inter-agent context sharing.
    attack_surfaces:
      - "Delegation parameter: actor_role passed to Findings Manager"
      - "System prompt: potential credential inclusion"
      - "Inter-agent context: identity information shared with Reader"
    trust_boundaries:
      - "HTTP auth → delegation parameter → FM authorization"
      - "Coordinator prompt → Reader delegation context"

  - threat_id: "IA.2"
    threat_name: "Privilege Escalation via Scope Creep"
    status: "Applicable"
    rationale: >
      The scope-request workflow allows Analysts to request temporary write
      permissions. The backend authorization service manages approval,
      scoping, and expiry. Each of these controls could be independently
      weakened: auto-approval, overbroad grants, or persistent grants.
    attack_surfaces:
      - "request_scope tool: scope request creation"
      - "Scope grant: finding_id scoping, session binding, expiry"
    trust_boundaries:
      - "Analyst request → Manager approval gate"
      - "Grant scope → specific finding vs all findings"
      - "Grant lifetime → session binding and expiry"

  - threat_id: "XA.1"
    threat_name: "Insecure Inter-Agent Communication"
    status: "Applicable"
    rationale: >
      The three agents communicate via in-process Python function calls
      using DelegationContext. The Coordinator controls what data reaches
      each agent. Trust-boundary failures include: unfiltered content relay,
      unvalidated references, excessive context sharing, and trusting
      authority claims from untrusted agent output.
    attack_surfaces:
      - "Coordinator → FM: raw Reader output as operational context"
      - "Coordinator → Reader: identity and credential leakage"
      - "Reader output: authority claims and finding references"
    trust_boundaries:
      - "Reader output → Coordinator trust decision"
      - "Coordinator context → FM operational parameters"
      - "Coordinator metadata → Reader delegation context"

# ═══════════════════════════════════════════════════════════════════════════════
# PART B: TRA Risk Register
#
# All ten columns present for every entry:
#   1. Risk ID
#   2. Threat Category
#   3. Risk Scenario
#   4. Impact
#   5. Security Concerns (CIA)
#   6. Proposed Controls
#   7. Preliminary Assessment — Likelihood
#   8. Risk Rating
#   9. Risk Level
#  10. Comments
# ═══════════════════════════════════════════════════════════════════════════════

risk_register:
  - risk_id: "RISK-001"
    threat_category: "RP.1"
    risk_scenario: >
      Attacker uploads a VAPT report containing an embedded instruction
      to change finding severity. The instruction is processed by the
      Document Reader and relayed through the Coordinator to the Findings
      Manager, resulting in an unauthorized finding modification.
    impact: "High — finding severity downgraded without authorization, misrepresenting security posture to stakeholders"
    security_concerns:
      confidentiality: false
      integrity: true
      availability: false
    proposed_controls:
      - "Mark uploaded content as untrusted in Reader prompt and wrap in delimiters"
      - "Coordinator treats agent responses as data, not instructions"
      - "Separate structured operational parameters from lower-trust narrative in inter-agent relay"
      - "Require Manager approval for scope grants"
    preliminary_likelihood: "Possible"
    risk_rating: "Possible × High"
    risk_level: "High"
    comments: >
      Preliminary — likelihood depends on real LLM susceptibility to indirect
      prompt injection in a multi-agent context. Multiple independent controls
      at content handling, relay integrity, and backend authorization layers
      could each independently mitigate. Requires red-team testing to confirm.

  - risk_id: "RISK-002"
    threat_category: "RP.1"
    risk_scenario: >
      Attacker extracts confidential system prompt content (internal policy
      identifiers or internal contact information) through direct chat
      prompt extraction techniques.
    impact: "Medium — disclosure of internal system configuration or operational contacts"
    security_concerns:
      confidentiality: true
      integrity: false
      availability: false
    proposed_controls:
      - "Include instruction hierarchy in system prompt"
      - "Do not include secrets in system prompts where possible"
    preliminary_likelihood: "Possible"
    risk_rating: "Possible × Medium"
    risk_level: "Medium"
    comments: >
      Preliminary — depends on LLM's resistance to prompt extraction.
      Impact is Medium because the leaked content is evaluation
      infrastructure, not real operational data.

  - risk_id: "RISK-003"
    threat_category: "RP.2"
    risk_scenario: >
      Injected content in a document causes the Coordinator to change its
      task plan — adding unauthorized steps such as delegating finding
      updates that the user did not request.
    impact: "High — unauthorized actions executed without user consent; finding records modified"
    security_concerns:
      confidentiality: false
      integrity: true
      availability: false
    proposed_controls:
      - "Coordinator only delegates updates on explicit user request"
      - "Coordinator treats agent responses as data, not instructions"
      - "Instruction hierarchy prevents plan changes from content"
    preliminary_likelihood: "Possible"
    risk_rating: "Possible × High"
    risk_level: "High"
    comments: >
      Preliminary — goal hijack is a potential mechanism by which prompt
      injection could lead to unauthorized actions. Requires testing to
      confirm whether the Coordinator is susceptible.

  - risk_id: "RISK-004"
    threat_category: "KM.1"
    risk_scenario: >
      Injected content from an earlier conversation turn persists in
      session history and influences the AI's behavior in a later,
      unrelated turn within the same session.
    impact: "Medium — delayed unauthorized actions; user unaware that earlier content is influencing current responses"
    security_concerns:
      confidentiality: false
      integrity: true
      availability: false
    proposed_controls:
      - "Sanitize conversation history to remove instruction-like content"
      - "Send only current task to Reader, not full history"
    preliminary_likelihood: "Possible"
    risk_rating: "Possible × Medium"
    risk_level: "Medium"
    comments: >
      Preliminary — requires multi-turn testing to confirm. The application
      uses session-local history only (no persistent cross-session memory),
      which limits the attack window to a single session.

  - risk_id: "RISK-005a"
    threat_category: "TA.1"
    risk_scenario: >
      The Findings Manager accepts finding IDs without proper scope
      validation, allowing modification of findings the user should
      not have access to (e.g., findings from a different report context).
    impact: "High — unauthorized modification of findings outside the user's scope"
    security_concerns:
      confidentiality: false
      integrity: true
      availability: false
    proposed_controls:
      - "Scope finding access to user's accessible reports"
    preliminary_likelihood: "Possible"
    risk_rating: "Possible × High"
    risk_level: "High"
    comments: >
      Preliminary — requires testing whether the FM accepts out-of-scope
      finding IDs when the control is absent.

  - risk_id: "RISK-005b"
    threat_category: "TA.1"
    risk_scenario: >
      The Findings Manager accepts invalid or unexpected severity/status
      values from inter-agent delegation context without validation.
    impact: "Medium — invalid assessment records written to the database"
    security_concerns:
      confidentiality: false
      integrity: true
      availability: false
    proposed_controls:
      - "Validate severity/status against allowed enum values before writing"
    preliminary_likelihood: "Possible"
    risk_rating: "Possible × Medium"
    risk_level: "Medium"
    comments: >
      Preliminary — a tool-level input validation issue. Impact limited
      to data quality rather than unauthorized access.

  - risk_id: "RISK-005c"
    threat_category: "TA.1"
    risk_scenario: >
      Search or retrieval tools return content across report boundaries,
      exposing sensitive assessment notes or findings from reports the
      user should not see.
    impact: "Medium — information disclosure of internal or cross-report content"
    security_concerns:
      confidentiality: true
      integrity: false
      availability: false
    proposed_controls:
      - "Redact internal content from search results for analyst users"
      - "Scope get_findings to current task's report context"
    preliminary_likelihood: "Possible"
    risk_rating: "Possible × Medium"
    risk_level: "Medium"
    comments: >
      Preliminary — depends on whether the search and retrieval tools
      enforce report-level access boundaries.

  - risk_id: "RISK-006a"
    threat_category: "IA.1"
    risk_scenario: >
      Credentials (API keys or internal identifiers) in the Coordinator's
      system prompt leak to agents that don't need them through inter-agent
      delegation context, and are subsequently exposed to the user.
    impact: "High — credential exposure enabling potential downstream attacks"
    security_concerns:
      confidentiality: true
      integrity: false
      availability: false
    proposed_controls:
      - "Do not include credentials in system prompts"
      - "Send only task and report IDs to Reader, not identity or credentials"
    preliminary_likelihood: "Possible"
    risk_rating: "Possible × High"
    risk_level: "High"
    comments: >
      Preliminary — requires the Coordinator to both hold credentials in its
      prompt AND share context excessively with the Reader. Two controls must
      both fail. Requires testing.

  - risk_id: "RISK-006b"
    threat_category: "IA.1"
    risk_scenario: >
      The Findings Manager trusts the user role from delegation parameters
      or uses its own service-level permissions instead of independently
      verifying the user's authorization, allowing an analyst to perform
      manager-only operations.
    impact: "High — unauthorized privilege use; analyst performs manager actions"
    security_concerns:
      confidentiality: false
      integrity: true
      availability: false
    proposed_controls:
      - "Findings Manager verifies role independently from HTTP auth context"
      - "Use user's effective permissions, not agent's service access"
    preliminary_likelihood: "Possible"
    risk_rating: "Possible × High"
    risk_level: "High"
    comments: >
      Preliminary — role bypass at the authorization layer. Distinct from
      credential leakage (RISK-006a). Requires testing to confirm whether
      the FM actually accepts spoofed roles.

  - risk_id: "RISK-007"
    threat_category: "IA.2"
    risk_scenario: >
      The scope-request workflow is abused: auto-approval without Manager,
      overbroad grants covering all findings, or grants persisting across
      sessions beyond their intended lifetime.
    impact: "High — analyst gains unauthorized write access to findings; privilege escalation"
    security_concerns:
      confidentiality: false
      integrity: true
      availability: false
    proposed_controls:
      - "Require Manager approval for all analyst scope requests"
      - "Scope grants to the specific requested finding"
      - "Bind grants to session and enforce expiry"
    preliminary_likelihood: "Possible"
    risk_rating: "Possible × High"
    risk_level: "High"
    comments: >
      Preliminary — each scope control is independently testable.
      Auto-approval (IA2-01) is currently implemented and can be tested.
      Overbroad and persistent grants (IA2-02, IA2-03) are planned.

  - risk_id: "RISK-008"
    threat_category: "XA.1"
    risk_scenario: >
      The Coordinator forwards raw, unsanitized Reader output to the
      Findings Manager, allowing injected instructions to cross the
      inter-agent trust boundary. The Coordinator may also trust authority
      claims from Reader's response or forward unvalidated finding references.
    impact: "High — cross-agent injection; unauthorized finding modifications via relayed instructions"
    security_concerns:
      confidentiality: false
      integrity: true
      availability: false
    proposed_controls:
      - "Separate structured parameters from lower-trust narrative in relay"
      - "Verify authority claims against backend records, not Reader output"
      - "Validate finding references against task scope"
      - "Send only task metadata to Reader, not credentials or role"
    preliminary_likelihood: "Possible"
    risk_rating: "Possible × High"
    risk_level: "High"
    comments: >
      Preliminary — the inter-agent relay is a hypothesized critical step
      in the document-injection attack chain (RISK-001). Structured
      separation control (XA1-02) is implemented. Other controls are planned.

