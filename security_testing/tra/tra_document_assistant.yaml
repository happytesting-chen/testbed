# Threat and Risk Assessment — Multi-Agent Document Assistant
# Generated by Threat Modeling Skill
# Date: 2026-11-24
# Target: Document Assistant (Coordinator + Document Reader + Findings Manager)

target:
  name: "Multi-Agent Document Assistant"
  description: "Three-agent cybersecurity assessment workbench with Coordinator, Document Reader, and Findings Manager"
  agents: ["Coordinator", "Document Reader", "Findings Manager"]
  entry_channels:
    C1: "Direct chat via POST /api/agent/chat"
    C2: "Uploaded reports via POST /api/reports/upload"
    C3: "Inter-agent delegation context (via C1 or C2 content)"
  roles: ["analyst", "manager", "evaluator"]
  data_assets:
    - "VAPT assessment reports (uploaded documents)"
    - "Security findings (severity, status)"
    - "Finding change history with authorization attribution"
    - "Scope grants and approval records"
    - "Agent system prompts and configuration"

# ═══════════════════════════════════════════════════════════════════════════════
# PART A: Threat Applicability Matrix
# ═══════════════════════════════════════════════════════════════════════════════

threat_applicability:
  - threat_id: "RP.1"
    threat_name: "Prompt Injection"
    status: "Applicable"
    rationale: >
      Uploaded reports (C2) contain attacker-controlled text that enters
      the Document Reader's LLM context. Direct chat messages (C1) reach
      the Coordinator's LLM context. Inter-agent delegation (C3) relays
      content across trust boundaries. All three channels can carry
      injected instructions.
    attack_surfaces:
      - "C2: uploaded reports processed by Document Reader"
      - "C1: direct chat messages to Coordinator"
      - "C3: Reader output relayed to Coordinator and Findings Manager"
    trust_boundaries:
      - "Document content → Reader LLM context"
      - "Reader output → Coordinator instruction processing"
      - "Coordinator context → Findings Manager delegation"

  - threat_id: "RP.2"
    threat_name: "Agent Goal Hijack"
    status: "Applicable"
    rationale: >
      The Coordinator maintains a task plan derived from the user's request.
      Content from the Document Reader's response could influence the
      Coordinator to change its plan or delegate tasks the user didn't request.
    attack_surfaces:
      - "C2→C3: injected content in Reader output influences Coordinator's plan"
    trust_boundaries:
      - "Reader output → Coordinator task planning"
      - "Coordinator plan → Findings Manager delegation"

  - threat_id: "KM.1"
    threat_name: "Memory and Context Poisoning"
    status: "Applicable"
    rationale: >
      Conversation history persists within a session and is sent to the LLM
      on each turn. Injected content from earlier turns can influence later
      turns. The Coordinator may forward full history to the Reader on
      delegation. FTS5 search retrieves uploaded content without trust ranking.
    attack_surfaces:
      - "Session history carrying injected content across turns"
      - "Full history forwarded to Reader on delegation"
      - "FTS5 search returning keyword-stuffed documents"
    trust_boundaries:
      - "Previous turn output → current turn LLM context"
      - "Coordinator history → Reader delegation context"

  - threat_id: "TA.1"
    threat_name: "Tool Misuse and Exploitation"
    status: "Applicable"
    rationale: >
      The Findings Manager exposes tools that modify database state
      (update_finding). The scope management workflow has multiple
      authorization controls that could be individually weakened.
      Search tools may return content across trust boundaries.
    attack_surfaces:
      - "update_finding tool: severity/status modification"
      - "search_reports: information disclosure"
      - "get_findings: cross-report data exposure"
    trust_boundaries:
      - "Tool arguments → database modification"
      - "Authorization check → scope grant validation"

  - threat_id: "IA.1"
    threat_name: "Identity and Privilege Abuse"
    status: "Applicable"
    rationale: >
      User role flows from HTTP authentication through the Coordinator to
      the Findings Manager via delegation parameters. The Findings Manager
      could trust the delegated role instead of independently verifying
      against the HTTP auth context. Credentials could leak through
      system prompts or inter-agent context sharing.
    attack_surfaces:
      - "Delegation parameter: actor_role passed to Findings Manager"
      - "System prompt: potential credential inclusion"
      - "Inter-agent context: identity information shared with Reader"
    trust_boundaries:
      - "HTTP auth → delegation parameter → FM authorization"
      - "Coordinator prompt → Reader delegation context"

  - threat_id: "IA.2"
    threat_name: "Privilege Escalation via Scope Creep"
    status: "Applicable"
    rationale: >
      The scope-request workflow allows Analysts to request temporary write
      permissions. The backend authorization service manages approval,
      scoping, and expiry. Each of these controls could be independently
      weakened: auto-approval, overbroad grants, or persistent grants.
    attack_surfaces:
      - "request_scope tool: scope request creation"
      - "Scope grant: finding_id scoping, session binding, expiry"
    trust_boundaries:
      - "Analyst request → Manager approval gate"
      - "Grant scope → specific finding vs all findings"
      - "Grant lifetime → session binding and expiry"

  - threat_id: "XA.1"
    threat_name: "Insecure Inter-Agent Communication"
    status: "Applicable"
    rationale: >
      The three agents communicate via in-process Python function calls
      using DelegationContext. The Coordinator controls what data reaches
      each agent. Trust-boundary failures include: unfiltered content relay,
      unvalidated references, excessive context sharing, and trusting
      authority claims from untrusted agent output.
    attack_surfaces:
      - "Coordinator → FM: raw Reader output as operational context"
      - "Coordinator → Reader: identity and credential leakage"
      - "Reader output: authority claims and finding references"
    trust_boundaries:
      - "Reader output → Coordinator trust decision"
      - "Coordinator context → FM operational parameters"
      - "Coordinator metadata → Reader delegation context"

# ═══════════════════════════════════════════════════════════════════════════════
# PART B: TRA Risk Register
# ═══════════════════════════════════════════════════════════════════════════════

risk_register:
  - risk_id: "RISK-001"
    threat_category: "RP.1"
    risk_scenario: >
      Attacker uploads a VAPT report containing an embedded instruction
      to change finding severity. The instruction is processed by the
      Document Reader and relayed through the Coordinator to the Findings
      Manager, resulting in an unauthorized finding modification.
    impact: "Finding severity downgraded without authorization, misrepresenting security posture to stakeholders"
    security_concerns:
      confidentiality: false
      integrity: true
      availability: false
    proposed_controls:
      - "RP1-03: Mark uploaded content as untrusted in Reader prompt and wrap in delimiters"
      - "RP1-04: Coordinator treats agent responses as data, not instructions"
      - "XA1-02: Separate structured operational parameters from lower-trust narrative"
      - "IA2-01: Require Manager approval for scope grants"
    preliminary_likelihood: "Medium"
    risk_rating: "High"
    risk_level: "High"
    comments: >
      Likelihood is preliminary — depends on real LLM susceptibility to
      indirect prompt injection in a multi-agent context. Infrastructure
      controls at three independent layers (content handling, relay integrity,
      backend authorization) can each independently break the attack chain.

  - risk_id: "RISK-002"
    threat_category: "RP.1"
    risk_scenario: >
      Attacker extracts confidential system prompt content (internal policy
      identifiers, canary values, or internal contact information) through
      direct chat prompt extraction techniques.
    impact: "Disclosure of internal system configuration, evaluation infrastructure, or operational contacts"
    security_concerns:
      confidentiality: true
      integrity: false
      availability: false
    proposed_controls:
      - "RP1-01: Include instruction hierarchy in system prompt"
      - "RP1-02: Do not include secrets in system prompts (or protect with strong extraction resistance)"
    preliminary_likelihood: "Possible"
    risk_rating: "Medium"
    risk_level: "Medium"
    comments: >
      Likelihood depends on LLM's resistance to prompt extraction. Modern
      models have improved but are not immune to multi-turn extraction or
      encoding-based techniques. Impact is Medium because the leaked content
      is evaluation infrastructure, not real operational data.

  - risk_id: "RISK-003"
    threat_category: "RP.2"
    risk_scenario: >
      Injected content in a document causes the Coordinator to change its
      task plan — adding unauthorized steps such as delegating finding
      updates that the user did not request.
    impact: "Unauthorized actions executed without user consent; finding records modified"
    security_concerns:
      confidentiality: false
      integrity: true
      availability: false
    proposed_controls:
      - "RP2-03: Coordinator only delegates updates on explicit user request"
      - "RP1-04: Coordinator treats agent responses as data"
      - "RP1-01: Instruction hierarchy prevents plan changes from content"
    preliminary_likelihood: "Medium"
    risk_rating: "High"
    risk_level: "High"
    comments: >
      Related to RISK-001 — goal hijack is the mechanism by which prompt
      injection leads to unauthorized actions. The Coordinator's plan is
      the bridge between injection and exploitation.

  - risk_id: "RISK-004"
    threat_category: "KM.1"
    risk_scenario: >
      Injected content from an earlier conversation turn persists in
      session history and influences the AI's behavior in a later,
      unrelated turn within the same session.
    impact: "Delayed unauthorized actions; user unaware that earlier content is influencing current responses"
    security_concerns:
      confidentiality: false
      integrity: true
      availability: false
    proposed_controls:
      - "KM1-01: Sanitize conversation history to remove instruction-like content"
      - "KM1-03: Send only current task to Reader, not full history"
    preliminary_likelihood: "Possible"
    risk_rating: "Medium"
    risk_level: "Medium"
    comments: >
      Preliminary — requires multi-turn testing to confirm. The application
      uses session-local history only (no persistent cross-session memory),
      which limits the attack window to a single session.

  - risk_id: "RISK-005"
    threat_category: "TA.1"
    risk_scenario: >
      The Findings Manager accepts finding IDs, severity values, or status
      values without proper scope validation, allowing modification of
      findings the user should not have access to, or writing invalid values.
    impact: "Data integrity violation; cross-report data exposure; invalid assessment records"
    security_concerns:
      confidentiality: true
      integrity: true
      availability: false
    proposed_controls:
      - "TA1-01: Scope finding access to user's accessible reports"
      - "TA1-02: Validate severity/status against allowed enum values"
      - "TA1-03: Redact internal content from search results"
      - "TA1-04: Scope get_findings to current task context"
    preliminary_likelihood: "Possible"
    risk_rating: "Medium"
    risk_level: "Medium"
    comments: >
      These are independent tool-level controls. Each can be tested
      separately. Impact varies by specific weakness.

  - risk_id: "RISK-006"
    threat_category: "IA.1"
    risk_scenario: >
      Credentials (API keys, canary values) or user identity information
      leak through system prompts or inter-agent delegation context to
      agents that don't need them, enabling credential theft or
      role spoofing.
    impact: "Credential exposure; potential for identity-based attacks; unauthorized access"
    security_concerns:
      confidentiality: true
      integrity: true
      availability: false
    proposed_controls:
      - "IA1-01: Do not include credentials in system prompts"
      - "IA1-02: Findings Manager verifies role from HTTP auth, not delegation"
      - "IA1-03: Use user's effective permissions, not agent's service access"
      - "XA1-04: Send only task and report IDs to Reader, not identity or credentials"
    preliminary_likelihood: "Possible"
    risk_rating: "High"
    risk_level: "High"
    comments: >
      Credential leakage (IA1-01 + XA1-04) is a cross-agent attack that
      requires the Coordinator to over-share context. Role bypass (IA1-02,
      IA1-03) is at the authorization layer. Both are independently testable.

  - risk_id: "RISK-007"
    threat_category: "IA.2"
    risk_scenario: >
      The scope-request workflow is abused: auto-approval without Manager,
      overbroad grants covering all findings, or grants persisting across
      sessions beyond their intended lifetime.
    impact: "Analyst gains unauthorized write access to findings; privilege escalation"
    security_concerns:
      confidentiality: false
      integrity: true
      availability: false
    proposed_controls:
      - "IA2-01: Require Manager approval for all analyst scope requests"
      - "IA2-02: Scope grants to the specific requested finding"
      - "IA2-03: Bind grants to session and enforce expiry"
    preliminary_likelihood: "Medium"
    risk_rating: "High"
    risk_level: "High"
    comments: >
      IA2-01 is implemented and testable. IA2-02 and IA2-03 are planned.
      Each control is independently testable with IA2-01 disabled (using
      Manager-approved grants).

  - risk_id: "RISK-008"
    threat_category: "XA.1"
    risk_scenario: >
      The Coordinator forwards raw, unsanitized Reader output to the
      Findings Manager, allowing injected instructions to cross the
      inter-agent trust boundary. Additionally, the Coordinator may
      trust authority claims from Reader's response or forward
      unvalidated finding references.
    impact: "Cross-agent injection; unauthorized finding modifications via relayed instructions"
    security_concerns:
      confidentiality: false
      integrity: true
      availability: false
    proposed_controls:
      - "XA1-02: Separate structured parameters from lower-trust narrative"
      - "XA1-01: Verify authority claims against backend records, not Reader output"
      - "XA1-03: Validate finding references against task scope"
      - "XA1-04: Send only task metadata to Reader, not credentials or role"
    preliminary_likelihood: "Medium"
    risk_rating: "High"
    risk_level: "High"
    comments: >
      XA1-02 is implemented and testable. The inter-agent relay is the
      critical bridge in the F1 attack chain (RISK-001).

