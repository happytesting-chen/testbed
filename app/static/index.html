<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Assistant</title>
<style>
:root{--ink:#1c2733;--muted:#5b6b7a;--line:#d5dde5;--bg:#f3f6f8;--panel:#fff;--accent:#24577a;
--crit:#b3261e;--high:#c25e00;--med:#8a6d00;--ok:#2e7d4f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#e3e9ef;--muted:#9aaab8;--line:#33424f;--bg:#141b22;
--panel:#1b242d;--accent:#7fb3d6;--crit:#ff8a80;--high:#ffb366;--med:#e6c84f;--ok:#7dd3a0;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;gap:1.5rem;padding:.75rem 1.25rem;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:1rem;margin:0;font-weight:650}
#who{margin-left:auto;color:var(--muted);font-size:.875rem}
main{max-width:1280px;margin:1.25rem auto;padding:0 1.25rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1rem;margin-bottom:1rem}
button.act,input[type=submit]{background:var(--accent);color:var(--panel);border:0;border-radius:6px;padding:.4rem .85rem;font:inherit;cursor:pointer}
button.act-outline{background:none;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:.4rem .85rem;font:inherit;cursor:pointer}
button.act-outline:hover{background:var(--accent);color:var(--panel)}
input[type=password],input[type=text]{width:100%;padding:.5rem;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:.75rem;border-radius:6px;overflow:auto;font-size:.8rem}
.err{color:var(--crit)}a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#workspace{display:none;gap:1rem;align-items:flex-start}
#workspace.on{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:800px){#workspace.on{grid-template-columns:1fr}}

#left .upload-row{display:flex;gap:.5rem;margin-top:.35rem}
#left .upload-row input[type=file]{flex:1}

/* Report header */
.report-header{display:flex;align-items:center;gap:.5rem;padding:.6rem .5rem;cursor:pointer;border-bottom:1px solid var(--line);user-select:none}
.report-header:hover{background:var(--bg)}
.report-chevron{font-size:.7rem;color:var(--muted);width:1rem;text-align:center;transition:transform .15s}
.report-chevron.open{transform:rotate(90deg)}
.report-name{font-weight:650;font-size:.9rem;flex:1}
.report-count{font-size:.75rem;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.1rem .45rem}
.report-date{font-size:.75rem;color:var(--muted);white-space:nowrap}
.small-btn{font-size:.72rem;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:4px;padding:.15rem .4rem;cursor:pointer;white-space:nowrap}
.small-btn:hover{background:var(--accent);color:var(--panel)}

/* Findings table inside each report group */
.findings-group{display:none;border-bottom:1px solid var(--line)}
.findings-group.open{display:block}
.findings-table{width:100%;border-collapse:collapse}
.findings-table th{text-align:left;padding:.35rem .5rem .35rem 1.8rem;font-size:.75rem;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.findings-table td{padding:.4rem .5rem .4rem 1.8rem;border-bottom:1px solid var(--line);font-size:.85rem;vertical-align:middle}
.findings-table tr.finding-data:hover{background:var(--bg)}
.findings-table tr.finding-data{cursor:pointer}
.findings-table tr.finding-data.selected{background:#eef4fb}
.finding-id{font-weight:600;color:var(--accent)}
.finding-sev{font-weight:600}
.finding-empty{padding:.5rem 1.8rem;color:var(--muted);font-size:.8rem;font-style:italic;border-bottom:1px solid var(--line)}

/* Edit-mode toolbar */
.edit-toolbar{display:flex;gap:.4rem;align-items:center;padding:.4rem .5rem .4rem 1.8rem;background:var(--bg);border-bottom:1px solid var(--line);font-size:.8rem}
.edit-toolbar .save-status{flex:1;color:var(--muted);font-size:.78rem}
.edit-select{font-size:.82rem;padding:.2rem .3rem;border:1px solid var(--accent);border-radius:4px;background:var(--panel);color:var(--ink)}
.edit-select.dirty{border-color:var(--high);background:#fffbeb}

/* Detail panel */
#detail-panel{display:none}
#detail-panel.on{display:block}
.detail-grid{display:grid;grid-template-columns:auto 1fr;gap:.3rem .8rem;font-size:.85rem;margin-bottom:.75rem}
.detail-label{color:var(--muted);font-weight:600}
.detail-desc{margin-top:.5rem;font-size:.85rem;line-height:1.6}

/* History timeline */
.history-list{list-style:none;padding:0;margin:.5rem 0 0}
.history-item{padding:.4rem 0 .4rem .8rem;border-left:2px solid var(--line);margin-bottom:.3rem;font-size:.8rem}
.history-item .actor{font-weight:600}
.history-item .ts{color:var(--muted);font-size:.75rem}
.history-change{display:inline-block;background:var(--bg);border-radius:3px;padding:.1rem .3rem;font-size:.78rem;margin-top:.15rem}

/* Report viewer */
#report-viewer{display:none}
#report-viewer.on{display:block}
#report-viewer pre{max-height:380px}
#report-viewer-name{font-size:.9rem;font-weight:650;margin:0 0 .4rem}

/* Chat */
#right{position:sticky;top:1.25rem;height:calc(100vh - 90px)}
#right .panel{height:100%;display:flex;flex-direction:column;margin-bottom:0}
#log{display:flex;flex-direction:column;gap:.6rem;flex:1;overflow:auto;margin-bottom:.75rem}
.msg{padding:.6rem .8rem;border-radius:8px;max-width:88%;white-space:pre-wrap;font-size:.9rem}
.me{align-self:flex-end;background:var(--accent);color:var(--panel)}
.bot{background:var(--bg)}
.chat-row{display:flex;gap:.5rem}
.chat-row input{flex:1;padding:.5rem;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
</style>
</head>
<body>
<header>
  <h1>Document Assistant</h1>
  <span id="who">Not signed in</span>
</header>
<main>
  <div class="panel" id="signin">
    <div style="display:flex;gap:.5rem;align-items:end;margin-bottom:.5rem">
      <div style="flex:1">
        <label for="tok" style="font-size:.85rem">Access token</label>
        <input id="tok" type="password" autocomplete="off">
      </div>
      <button class="act" id="go">Sign in</button>
    </div>
    <div style="display:flex;gap:.5rem;align-items:center">
      <span style="font-size:.8rem;color:var(--muted)">Quick switch:</span>
      <button class="act-outline" id="sw-analyst" style="font-size:.8rem">Analyst</button>
      <button class="act-outline" id="sw-manager" style="font-size:.8rem">Manager</button>
      <button class="act-outline" id="sw-logout" style="font-size:.8rem;display:none">Logout</button>
    </div>
    <p id="sierr" class="err"></p>
  </div>

  <div id="workspace">
    <div id="left">
      <div class="panel">
        <form id="up">
          <label for="file" style="font-size:.85rem;color:var(--muted)">Upload report (.txt or .md, max 1 MB)</label>
          <div class="upload-row">
            <input id="file" type="file" accept=".txt,.md">
            <input type="submit" value="Upload">
          </div>
        </form>
        <p id="upmsg" style="margin:.4rem 0 0;font-size:.85rem"></p>
      </div>

      <div class="panel" id="hierarchy-panel">
        <div style="font-weight:650;font-size:.85rem;margin-bottom:.4rem">Reports &amp; Findings</div>
        <div id="hierarchy"></div>
      </div>

      <div class="panel" id="detail-panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
          <strong id="detail-title" style="font-size:.9rem"></strong>
          <button class="small-btn" onclick="closeDetail()">Close</button>
        </div>
        <div id="detail-body"></div>
      </div>

      <div class="panel" id="report-viewer">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem">
          <p id="report-viewer-name" style="margin:0"></p>
          <button class="small-btn" onclick="closeReportViewer()">Close</button>
        </div>
        <pre id="vc"></pre>
      </div>
    </div>

    <div id="right">
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem">
          <strong style="font-size:.9rem">AI Assistant</strong>
          <button class="act" id="newchat" type="button" style="font-size:.8rem;padding:.25rem .6rem">New chat</button>
        </div>
        <div id="log" style="flex:1"></div>
        <div class="chat-row">
          <input id="q" type="text" placeholder="Ask about a report or finding…" aria-label="Message">
          <button class="act" id="send">Send</button>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
let token="",session=null,role="";
let allReports=[],allFindings=[];
let editingReportId=null;
const dirtyFindings={};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SEV_COLOR={Critical:"var(--crit)",High:"var(--high)",Medium:"var(--med)",Low:"var(--ok)",Informational:"var(--muted)"};
const SEVS=["Critical","High","Medium","Low","Informational"];
const STATS=["Open","In Progress","Resolved","Accepted Risk"];

async function api(path,opt={}){
  opt.headers={...(opt.headers||{}),Authorization:"Bearer "+token};
  const r=await fetch(path,opt);
  const b=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(b.detail||("HTTP "+r.status));
  return b;
}

let devTokens=null;
async function loadDevTokens(){
  try{devTokens=await(await fetch("/api/dev/tokens")).json()}catch(e){devTokens=null}
}
loadDevTokens();

async function signIn(t){
  token=t||$("tok").value.trim();
  $("tok").value=token;
  try{
    const me=await api("/api/me");
    role=me.role;session=null;
    $("who").textContent=me.user+" ("+me.role+")";
    $("signin").hidden=true;
    $("workspace").classList.add("on");
    $("sw-logout").style.display="inline-block";
    loadReportsAndFindings();
  }catch(e){$("sierr").textContent="Sign-in failed: "+e.message}
}
$("go").onclick=()=>signIn();
$("sw-analyst").onclick=()=>{if(devTokens)signIn(devTokens.analyst)};
$("sw-manager").onclick=()=>{if(devTokens)signIn(devTokens.manager)};
$("sw-logout").onclick=()=>{
  token="";role="";session=null;
  $("who").textContent="Not signed in";
  $("signin").hidden=false;
  $("workspace").classList.remove("on");
  $("sw-logout").style.display="none";
  $("sierr").textContent="";
};

// ── hierarchical reports + findings ──────────────────────────────────────────
async function loadReportsAndFindings(){
  const [reports,findings]=await Promise.all([
    api("/api/reports").catch(()=>[]),
    api("/api/findings").catch(()=>[])
  ]);
  allReports=reports;allFindings=findings;

  const byReport={};
  findings.forEach(f=>{
    const rid=f.report_id||"_orphan";
    (byReport[rid]=byReport[rid]||[]).push(f);
  });

  reports.sort((a,b)=>b.created_at.localeCompare(a.created_at));
  const box=$("hierarchy");
  if(!reports.length){
    box.innerHTML='<div style="color:var(--muted);padding:.5rem;font-size:.85rem">No reports uploaded yet.</div>';
    return;
  }

  let html='';
  reports.forEach(r=>{
    const rf=byReport[r.id]||[];
    const count=rf.length;
    const date=new Date(r.created_at).toLocaleString("en-SG",{timeZone:"Asia/Singapore",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
    const isEditing=editingReportId===r.id;
    const editBtn=(role==="manager"&&count>0&&!isEditing)
      ?`<button class="small-btn" onclick="event.stopPropagation();startEdit('${esc(r.id)}')">Edit Findings</button>`
      :'';
    const rvStatus=r.review_status||'Pending Review';
    const rvColor=rvStatus==='Reviewed'?'var(--ok)':rvStatus==='Requires Follow-up'?'var(--high)':'var(--muted)';
    const reviewBtn=role==="manager"
      ?`<button class="small-btn" onclick="event.stopPropagation();showReviewDialog('${esc(r.id)}','${esc(rvStatus)}','${esc(r.review_comment||"")}')">Review</button>`
      :'';
    html+=`<div class="report-header" onclick="toggleReport('${esc(r.id)}')">
      <span class="report-chevron${isEditing?' open':''}" id="chev-${esc(r.id)}">&#9654;</span>
      <span class="report-name">${esc(r.filename)}</span>
      <span class="report-count">${count} finding${count!==1?'s':''}</span>
      <span style="font-size:.72rem;color:${rvColor};border:1px solid ${rvColor};border-radius:10px;padding:.1rem .4rem">${esc(rvStatus)}</span>
      <span class="report-date">${esc(date)}</span>
      ${editBtn}
      ${reviewBtn}
      <button class="small-btn" onclick="event.stopPropagation();viewOriginalReport('${esc(r.id)}')">View Original</button>
    </div>`;

    html+=`<div class="findings-group${isEditing?' open':''}" id="fg-${esc(r.id)}">`;
    if(!rf.length){
      html+=`<div class="finding-empty">No findings extracted from this report.</div>`;
    } else {
      if(isEditing){
        html+='<div style="padding:.3rem .5rem .2rem 1.2rem;font-size:.78rem;font-weight:600;color:var(--muted)">Extracted Security Findings</div>';
        html+=renderEditTable(r.id,rf);
      } else {
        html+='<div style="padding:.3rem .5rem .2rem 1.2rem;font-size:.78rem;font-weight:600;color:var(--muted)">Extracted Security Findings</div>';
      html+=renderReadTable(rf);
      }
    }
    html+='</div>';
  });
  box.innerHTML=html;
}

function renderReadTable(findings){
  let h='<table class="findings-table"><thead><tr><th style="width:4rem">ID</th><th>Title</th><th style="width:5.5rem">Severity</th><th style="width:5.5rem">Status</th><th style="width:4.5rem">Updated by</th></tr></thead><tbody>';
  findings.forEach(f=>{
    const sevStyle=`color:${SEV_COLOR[f.severity]||'inherit'}`;
    h+=`<tr class="finding-data" data-fid="${esc(f.id)}" onclick="showFindingDetail('${esc(f.id)}')">
      <td class="finding-id">${esc(f.finding_id||"—")}</td>
      <td>${esc(f.title)}</td>
      <td class="finding-sev" style="${sevStyle}">${esc(f.severity)}</td>
      <td>${esc(f.status)}</td>
      <td style="color:var(--muted);font-size:.78rem">${esc(f.updated_by||"—")}</td>
    </tr>`;
  });
  h+='</tbody></table>';
  return h;
}

function renderEditTable(reportId,findings){
  let h='<table class="findings-table"><thead><tr><th style="width:4rem">ID</th><th>Title</th><th style="width:6.5rem">Severity</th><th style="width:7rem">Status</th><th style="width:4.5rem">Updated by</th></tr></thead><tbody>';
  findings.forEach(f=>{
    const sevOpts=SEVS.map(s=>`<option${s===f.severity?" selected":""}>${s}</option>`).join("");
    const staOpts=STATS.map(s=>`<option${s===f.status?" selected":""}>${s}</option>`).join("");
    h+=`<tr class="finding-data" data-fid="${esc(f.id)}">
      <td class="finding-id">${esc(f.finding_id||"—")}</td>
      <td>${esc(f.title)}</td>
      <td><select class="edit-select" data-fid="${esc(f.id)}" data-field="severity" data-orig="${esc(f.severity)}" onchange="markDirty(this)">${sevOpts}</select></td>
      <td><select class="edit-select" data-fid="${esc(f.id)}" data-field="status" data-orig="${esc(f.status)}" onchange="markDirty(this)">${staOpts}</select></td>
      <td style="color:var(--muted);font-size:.78rem">${esc(f.updated_by||"—")}</td>
    </tr>`;
  });
  h+='</tbody></table>';
  const dirtyCount=Object.keys(dirtyFindings).length;
  h+=`<div class="edit-toolbar" id="edit-toolbar-${esc(reportId)}">
    <span class="save-status" id="save-status-${esc(reportId)}">${dirtyCount?dirtyCount+' modified':'No changes'}</span>
    <button class="act-outline" style="font-size:.75rem;padding:.2rem .6rem" onclick="cancelEdit()">Cancel</button>
    <button class="act" style="font-size:.75rem;padding:.2rem .6rem" id="save-btn-${esc(reportId)}" onclick="saveChanges('${esc(reportId)}')"${dirtyCount?'':' disabled'}>Save Changes</button>
  </div>`;
  return h;
}

// ── edit mode ────────────────────────────────────────────────────────────────
function startEdit(reportId){
  editingReportId=reportId;
  Object.keys(dirtyFindings).forEach(k=>delete dirtyFindings[k]);
  loadReportsAndFindings();
}

function cancelEdit(){
  editingReportId=null;
  Object.keys(dirtyFindings).forEach(k=>delete dirtyFindings[k]);
  loadReportsAndFindings();
}

function markDirty(sel){
  const fid=sel.dataset.fid;
  const field=sel.dataset.field;
  const orig=sel.dataset.orig;
  const val=sel.value;
  if(!dirtyFindings[fid])dirtyFindings[fid]={};
  if(val!==orig){
    dirtyFindings[fid][field]=val;
  } else {
    delete dirtyFindings[fid][field];
    if(!Object.keys(dirtyFindings[fid]).length)delete dirtyFindings[fid];
  }
  sel.classList.toggle("dirty",val!==orig);
  updateEditToolbar();
}

function updateEditToolbar(){
  if(!editingReportId)return;
  const count=Object.keys(dirtyFindings).length;
  const status=$("save-status-"+editingReportId);
  const btn=$("save-btn-"+editingReportId);
  if(status)status.textContent=count?count+" finding"+(count>1?"s":"")+" modified":"No changes";
  if(btn)btn.disabled=!count;
}

async function saveChanges(reportId){
  const ids=Object.keys(dirtyFindings);
  if(!ids.length)return;
  const status=$("save-status-"+reportId);
  const btn=$("save-btn-"+reportId);
  if(btn)btn.disabled=true;
  if(status)status.textContent="Saving…";

  const results=[];
  for(const fid of ids){
    const body=dirtyFindings[fid];
    try{
      await api(`/api/findings/${fid}`,
        {method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      results.push({fid,ok:true});
    }catch(e){
      results.push({fid,ok:false,error:e.message});
    }
  }

  const failed=results.filter(r=>!r.ok);
  if(failed.length){
    const msg=failed.map(r=>`${r.fid.slice(0,8)}…: ${r.error}`).join("\n");
    if(status)status.textContent=`${failed.length} of ${ids.length} failed`;
    alert("Some changes failed:\n\n"+msg);
  }

  editingReportId=null;
  Object.keys(dirtyFindings).forEach(k=>delete dirtyFindings[k]);
  loadReportsAndFindings();
}

function toggleReport(id){
  if(editingReportId===id)return;
  const grp=$("fg-"+id);
  const chev=$("chev-"+id);
  if(!grp)return;
  const open=grp.classList.toggle("open");
  if(chev)chev.classList.toggle("open",open);
}

// ── finding detail (read-only view) ──────────────────────────────────────────
async function showFindingDetail(id){
  if(editingReportId)return;
  const f=await api("/api/findings/"+id);
  const report=allReports.find(r=>r.id===f.report_id);

  $("detail-title").textContent=(f.finding_id||"Finding")+" — "+f.title;

  let html='<div class="detail-grid">';
  html+=`<span class="detail-label">Severity</span><span class="finding-sev" style="color:${SEV_COLOR[f.severity]||''}">${esc(f.severity)}</span>`;
  html+=`<span class="detail-label">Status</span><span>${esc(f.status)}</span>`;
  html+=`<span class="detail-label">Finding ID</span><span>${esc(f.finding_id||"—")}</span>`;
  html+=`<span class="detail-label">Source report</span><span>${esc(report?report.filename:"Unknown")}</span>`;
  html+=`<span class="detail-label">Last updated by</span><span>${esc(f.updated_by||"—")}</span>`;
  html+='</div>';

  if(f.description){
    html+=`<div class="detail-label" style="margin-bottom:.2rem">Description</div>`;
    html+=`<div class="detail-desc">${esc(f.description)}</div>`;
  }

  html+=`<div style="margin-top:.75rem;border-top:1px solid var(--line);padding-top:.5rem">
    <span class="detail-label" style="font-size:.8rem">Change History</span>
    <div id="history-${esc(f.id)}"><span style="color:var(--muted);font-size:.8rem">Loading…</span></div>
  </div>`;

  $("detail-body").innerHTML=html;
  $("detail-panel").classList.add("on");
  document.querySelectorAll(".finding-data").forEach(r=>r.classList.toggle("selected",r.dataset.fid===id));
  loadHistory(f.id);
}

async function loadHistory(id){
  const h=await api("/api/findings/"+id+"/history").catch(()=>[]);
  const box=$("history-"+id);
  if(!box)return;
  if(!h.length){
    box.innerHTML='<span style="color:var(--muted);font-size:.8rem">No modifications yet.</span>';
    return;
  }
  let html='<ul class="history-list">';
  h.forEach(e=>{
    const ts=e.ts?e.ts.slice(0,19).replace("T"," "):"";
    let changes=[];
    if(e.old_severity!==e.new_severity) changes.push(`severity: ${esc(e.old_severity)} → ${esc(e.new_severity)}`);
    if(e.old_status!==e.new_status) changes.push(`status: ${esc(e.old_status)} → ${esc(e.new_status)}`);
    html+=`<li class="history-item">
      <span class="actor">${esc(e.actor)}</span> <span class="ts">${esc(ts)}</span>
      ${changes.map(c=>`<div class="history-change">${c}</div>`).join("")}
    </li>`;
  });
  html+='</ul>';
  box.innerHTML=html;
}

function closeDetail(){
  $("detail-panel").classList.remove("on");
  document.querySelectorAll(".finding-data").forEach(r=>r.classList.remove("selected"));
}

// ── report viewer ────────────────────────────────────────────────────────────
async function viewOriginalReport(id){
  const r=await api("/api/reports/"+id);
  $("report-viewer-name").textContent=r.filename;
  $("vc").textContent=r.content;
  $("report-viewer").classList.add("on");
}

function closeReportViewer(){$("report-viewer").classList.remove("on")}

// ── upload ────────────────────────────────────────────────────────────────────
$("up").onsubmit=async e=>{
  e.preventDefault();
  const f=$("file").files[0];if(!f)return;
  const fd=new FormData();fd.append("file",f);
  try{
    const r=await api("/api/reports/upload",{method:"POST",body:fd});
    $("upmsg").textContent="Uploaded "+r.filename;
    loadReportsAndFindings();
  }catch(err){$("upmsg").textContent=err.message}
};

// ── chat ──────────────────────────────────────────────────────────────────────
function addMsg(cls,text){
  const d=document.createElement("div");
  d.className="msg "+cls;d.textContent=text;
  $("log").append(d);$("log").scrollTop=1e9;
  return d;
}

async function sendMessage(text){
  const q=text||$("q").value.trim();
  if(!q)return;
  $("q").value="";
  addMsg("me",q);
  const p=addMsg("bot","Working…");
  try{
    const r=await api("/api/agent/chat",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:q,session_id:session})});
    session=r.session_id;
    p.textContent=r.response;
    loadReportsAndFindings();
  }catch(err){p.textContent=err.message;p.classList.add("err")}
}

$("send").onclick=()=>sendMessage();
$("q").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}};
$("newchat").onclick=()=>{session=null;$("log").innerHTML=""};

// ── review dialog ────────────────────────────────────────────────────────────
function showReviewDialog(rid,currentStatus,currentComment){
  const statuses=["Pending Review","Reviewed","Requires Follow-up"];
  let html=`<div style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center" id="rv-overlay" onclick="if(event.target===this)this.remove()">
    <div style="background:var(--panel);border-radius:8px;padding:1.25rem;width:380px;max-width:90vw">
      <div style="font-weight:650;margin-bottom:.75rem">Update Review Status</div>
      <label style="font-size:.85rem;color:var(--muted)">Status</label>
      <select id="rv-status" style="width:100%;padding:.4rem;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;margin-bottom:.5rem">
        ${statuses.map(s=>`<option value="${s}"${s===currentStatus?' selected':''}>${s}</option>`).join('')}
      </select>
      <label style="font-size:.85rem;color:var(--muted)">Comment (optional)</label>
      <input id="rv-comment" type="text" value="${esc(currentComment)}" placeholder="Add a review comment..." style="margin-bottom:.75rem">
      <div style="display:flex;gap:.5rem;justify-content:flex-end">
        <button class="act-outline" onclick="document.getElementById('rv-overlay').remove()">Cancel</button>
        <button class="act" onclick="submitReview('${esc(rid)}')">Save</button>
      </div>
      <p id="rv-err" class="err" style="margin:.4rem 0 0;font-size:.85rem"></p>
    </div>
  </div>`;
  document.body.insertAdjacentHTML("beforeend",html);
}

async function submitReview(rid){
  const status=$("rv-status").value;
  const comment=$("rv-comment").value.trim()||null;
  try{
    await api("/api/reports/"+rid+"/review",{method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({review_status:status,comment:comment})});
    document.getElementById("rv-overlay").remove();
    loadReportsAndFindings();
  }catch(e){$("rv-err").textContent=e.message}
}
</script>
</body>
</html>
